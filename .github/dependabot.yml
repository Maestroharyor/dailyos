version: 2
updates:
  # Bun supports version updates only; Dependabot does not offer security
  # updates for the bun ecosystem.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # MUST come first. `prisma` is a devDependency and `@prisma/client` is a
      # production one, so the dev/prod groups below would split them into two
      # PRs — and a version mismatch between them fails `prisma generate`,
      # which runs from postinstall. They have to move together. No
      # update-types filter here on purpose: majors must stay grouped too.
      prisma:
        patterns:
          - prisma
          - '@prisma/*'

      # Biome is pinned exact and gets its own PR on purpose. Its output is
      # the lint result AND the formatting of every file, so a bump is a diff
      # to read rather than a rubber stamp. Bundled into dev-dependencies it
      # would arrive alongside ten unrelated bumps.
      biome:
        patterns:
          - '@biomejs/biome'

      # Next 16, Prisma 7 and Tailwind 4 all move fast. Grouping keeps the
      # queue readable instead of one PR per patch bump.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
